name = "bds-brain-mcp"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Public origin where this Worker is reachable. Used by generate_image
# to build absolute image URLs. Change this for your own fork.
PUBLIC_BASE_URL = "https://bds-brain-mcp.clarityva-support.workers.dev"

[ai]
binding = "AI"

[[vectorize]]
binding = "BDS_INDEX"
index_name = "bds-brain-index"

[[d1_databases]]
binding = "BDS_META"
database_name = "bds-brain-meta"
database_id = "PLACEHOLDER_SEE_README"

[[kv_namespaces]]
binding = "BDS_BRAIN_KV"
id = "PLACEHOLDER_SEE_README"

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "BdsBrainMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BdsBrainMCP"]

[observability]
enabled = true